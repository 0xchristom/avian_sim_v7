<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avian Sim v7.0 PRO</title>
    <style>
        :root { 
            --bg: #0a0b10; --panel: #14161f; --text: #d4d4d4; 
            --accent: #00ffcc; --danger: #ff3366; --orange: #ff6c0c; 
        }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; display: flex; height: 100vh; overflow: hidden; }
        canvas { background: #1a1c25; border: 1px solid #333; box-shadow: 0 0 20px rgba(0,255,204,0.1); }
        .sidebar { width: 350px; background: var(--panel); padding: 15px; height: 533px; overflow-y: auto; border-left: 2px solid var(--orange); box-sizing: border-box; }
        .sidebar-header { padding-bottom: 15px; border-bottom: 1px solid #333; margin-bottom: 15px; }
        .sidebar-header h2 { margin: 0; color: var(--orange); font-size: 18px; }
        .sidebar-header p { margin: 5px 0 0 0; font-size: 12px; color: #888; }
        .agent-card { background: #1a1c25; border: 1px solid #444; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .agent-card h4 { margin: 0 0 10px 0; color: var(--orange); border-bottom: 1px solid #444; padding-bottom: 5px; display: flex; justify-content: space-between; font-size: 14px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; }
        .bar-bg { width: 100%; height: 6px; background: #333; margin-bottom: 10px; border-radius: 3px; }
        .bar-fill { height: 100%; border-radius: 3px; }
        h3 { border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 0; color: var(--accent); font-size: 14px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
