<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avian Sim v7.0 PRO</title>
    <style>
        :root { 
            --bg: #0a0b10; --panel: #14161f; --text: #d4d4d4; 
            --accent: #00ffcc; --danger: #ff3366; --orange: #ff6c0c; 
            --btn-bg: #2a2f3a; --btn-hover: #3a4150;
        }
        /* Sprint 5 (background task): the app background is the repo-owned
           asset copied from `D:\Gemini\golebie\visuals\background no fireflies.jpg`
           → `viewer/public/assets/background-no-fireflies.jpg`. The build only
           references the relative `/assets/...` URL, never the source path. */
        body {
            margin: 0;
            background-color: var(--bg);
            background-image: url('/assets/background-no-fireflies.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Courier New', monospace;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Semi-transparent overlay keeps text and the WebGL canvas readable
           over the photo background (Sprint 5 background task item 3). Painted
           above the image but below the app content. */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(10, 11, 16, 0.72);
            z-index: -1;
            pointer-events: none;
        }
        
        .sidebar { 
            width: 340px; background: var(--panel); border-right: 2px solid var(--orange); 
            box-sizing: border-box; display: flex; flex-direction: column; height: 100vh; overflow-y: auto;
        }
        .sidebar-header { padding: 15px; border-bottom: 2px solid var(--orange); text-align: center; }
        
        .toolbar { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; 
            border-bottom: 1px solid #333;
        }
        .tool-btn { 
            aspect-ratio: 1; background: var(--btn-bg); border: 1px solid #444; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            position: relative; transition: background 0.2s; border-radius: 4px;
        }
        .tool-btn:hover { background: var(--btn-hover); }
        .tool-btn.active { background: var(--orange); border-color: var(--orange); }
        .tool-btn.active svg { stroke: #000; }
        .tool-btn svg { stroke: var(--text); width: 22px; height: 22px; fill: none; stroke-width: 2; }
        
        .tool-btn::after {
            content: attr(data-tooltip);
            position: absolute; left: calc(100% + 15px); top: 50%; transform: translateY(-50%);
            background: #000; color: var(--accent); padding: 5px 10px; border-radius: 4px;
            font-size: 12px; white-space: nowrap; pointer-events: none;
            opacity: 0; transition: opacity 0.2s; z-index: 100; border: 1px solid var(--accent);
        }
        .tool-btn:hover::after { opacity: 1; }

        .dashboard { padding: 12px; flex: 1; }
        .agent-card { background: #1a1c25; border: 1px solid #444; padding: 6px 8px; margin-bottom: 6px; border-radius: 4px; }
        .agent-card h4 { margin: 0 0 8px 0; color: var(--orange); border-bottom: 1px solid #444; padding-bottom: 4px; display: flex; justify-content: space-between; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 11px; }
        .bar-bg { width: 100%; height: 6px; background: #333; margin-bottom: 8px; border-radius: 3px; }
        .bar-fill { height: 100%; border-radius: 3px; }
        h3 { border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 0; color: var(--accent); font-size: 13px; }
        
        .canvas-area { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        canvas { background: #1a1c25; border: 1px solid #333; box-shadow: 0 0 20px rgba(0,255,204,0.1); cursor: crosshair; max-width: 100%; max-height: 100%; }

        /* Sprint 5 (background task item 4): mobile. On narrow screens the
           sidebar becomes an overlay drawer (toggled by a hamburger button in
           the canvas corner) and the canvas reflows to the viewport — the app
           never horizontally scrolls. */
        .sidebar-toggle { display: none; }
        @media (max-width: 768px) {
            body { overflow: hidden; }
            .app-root { flex-direction: column; overflow: hidden; }
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 200;
                transform: translateX(-105%);
                transition: transform 0.22s ease;
                box-shadow: 0 0 24px rgba(0,0,0,0.6);
                border-right: 2px solid var(--orange);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-toggle {
                display: flex;
                position: fixed;
                top: 10px;
                left: 10px;
                z-index: 210;
                background: var(--panel);
                color: var(--orange);
                border: 1px solid var(--orange);
                border-radius: 4px;
                width: 38px;
                height: 38px;
                align-items: center;
                justify-content: center;
                font-size: 18px;
                cursor: pointer;
            }
            .canvas-area { padding: 8px; }
            main { padding: 8px !important; }
            canvas { max-width: 100%; max-height: 100%; }
            #root { overflow: hidden; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
