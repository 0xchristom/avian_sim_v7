<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avian Sim v7.0 PRO</title>
    <style>
        :root { 
            --bg: #0a0b10; --panel: #14161f; --text: #d4d4d4; 
            --accent: #00ffcc; --danger: #ff3366; --orange: #ff6c0c; 
            --btn-bg: #2a2f3a; --btn-hover: #3a4150;
        }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { 
            width: 340px; background: var(--panel); border-right: 2px solid var(--orange); 
            box-sizing: border-box; display: flex; flex-direction: column; height: 100vh; overflow-y: auto;
        }
        .sidebar-header { padding: 15px; border-bottom: 2px solid var(--orange); text-align: center; }
        
        .toolbar { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; 
            border-bottom: 1px solid #333;
        }
        .tool-btn { 
            aspect-ratio: 1; background: var(--btn-bg); border: 1px solid #444; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            position: relative; transition: background 0.2s; border-radius: 4px;
        }
        .tool-btn:hover { background: var(--btn-hover); }
        .tool-btn.active { background: var(--orange); border-color: var(--orange); }
        .tool-btn.active svg { stroke: #000; }
        .tool-btn svg { stroke: var(--text); width: 22px; height: 22px; fill: none; stroke-width: 2; }
        
        .tool-btn::after {
            content: attr(data-tooltip);
            position: absolute; left: calc(100% + 15px); top: 50%; transform: translateY(-50%);
            background: #000; color: var(--accent); padding: 5px 10px; border-radius: 4px;
            font-size: 12px; white-space: nowrap; pointer-events: none;
            opacity: 0; transition: opacity 0.2s; z-index: 100; border: 1px solid var(--accent);
        }
        .tool-btn:hover::after { opacity: 1; }

        .dashboard { padding: 12px; flex: 1; }
        .agent-card { background: #1a1c25; border: 1px solid #444; padding: 6px 8px; margin-bottom: 6px; border-radius: 4px; }
        .agent-card h4 { margin: 0 0 8px 0; color: var(--orange); border-bottom: 1px solid #444; padding-bottom: 4px; display: flex; justify-content: space-between; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 11px; }
        .bar-bg { width: 100%; height: 6px; background: #333; margin-bottom: 8px; border-radius: 3px; }
        .bar-fill { height: 100%; border-radius: 3px; }
        h3 { border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 0; color: var(--accent); font-size: 13px; }
        
        .canvas-area { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        canvas { background: #1a1c25; border: 1px solid #333; box-shadow: 0 0 20px rgba(0,255,204,0.1); cursor: crosshair; max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
