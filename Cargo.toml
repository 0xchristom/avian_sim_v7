[workspace]
members = [
    "avian_core",
    "avian_physics",
    "avian_agent",
    "avian_telemetry",
]
resolver = "2"

[workspace.dependencies]
hecs = { version = "0.10", features = ["column-serialize"] }
nalgebra = { version = "0.32", features = ["serde-serialize"] }
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "1.0"
smallvec = "1.13"
rapier2d = { version = "0.18", features = ["enhanced-determinism", "serde-serialize"] }
rustc-hash = "1.1"
tungstenite = "0.20"
ctrlc = "3.4"