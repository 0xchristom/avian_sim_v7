[workspace]
members = [
    "avian_core",
    "avian_physics",
    "avian_agent",
    "avian_telemetry",
]
resolver = "2"

[workspace.dependencies]
hecs = "0.10"
nalgebra = { version = "0.32", features = ["serde-serialize"] }
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
prost = "0.12"
prost-types = "0.12"
thiserror = "1.0"
heapless = "0.8"
hashbrown = "0.14"
smallvec = "1.13"
rapier2d = { version = "0.18", features = ["enhanced-determinism"] }