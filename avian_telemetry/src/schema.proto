syntax = "proto3";

package avian_sim.v7;

message TelemetryFrame {
  uint64 simulation_time_us = 1;
  uint32 frame_number = 2;
  repeated AgentState agents = 3;
  repeated GrainState grains = 4;
  FlockMetrics flock_metrics = 5;
}

message AgentState {
  string uid = 1;
  Vec2 position = 2;
  float heading = 3;
  Vec2 velocity = 4;
  string fsm_state = 5;
  float energy_kj = 6;
  float hunger = 7;
  uint32 stomach_crop = 8;
  uint32 stomach_gizzard = 9;
  repeated string visible_neighbors = 10;
  float age_years = 11;
  float mass_g = 12;
  uint32 peck_count = 13;
}

message Vec2 { float x = 1; float y = 2; }
message GrainState { string uid=1; Vec2 pos=2; bool consumed=3; }
message FlockMetrics { float avg_speed=1; float polarization=2; float cohesion=3; }
