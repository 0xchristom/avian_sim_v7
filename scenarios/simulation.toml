# simulation.toml — 5.2 scenario params (runtime-tunable per run).
#
# Rule (DEVELOPMENT_PLAN §5.2): this file carries SCENARIO params only.
# Biology constants (BMR, mass curve, speeds, vision FOV, energy-per-grain,
# vitality model, boids weights) live in avian_core/src/calibration.rs and
# are NOT overridable here. Any field omitted below falls back to the
# compiled default. Overlap with CLI flags: the command line wins.

# Run seed (None → server --seed, else 42).
# seed = 42

# Arena size in meters; the four boundary walls are built here.
world_width = 32.0
world_height = 21.0

# Initial population / grains spawned by the server at startup.
initial_agents = 30
initial_grains = 15

# Integration timestep (s) and real-time pacing for the interactive server.
# dt = 0.008333333333333333
# time_scale = 1.0

# Audit 4 §9.7: length of one full day/night cycle in sim-seconds. The compiled
# default (600 s, calibration::DAY_LENGTH_SIM_S) makes a day pass in ~17 real
# minutes even at 1× speed — after a 10×/100× burst it can read as "stuck
# fast". This longer, more legible cycle (~66 min at 1×) is what the
# interactive-view scenario uses; headless data-generation runs keep the
# compiled default unless they set this explicitly.
day_length_sim_s = 2400.0

# Hunger threshold that flips the root Forage condition (default = the
# biology constant FORAGING_HUNGER_THRESHOLD).
# foraging_threshold = 0.4

# Flock steering toggle — false = agents move by the behavior tree alone.
# flocking_enabled = true

# Scenario feature flags.
# predator_expiry = true
# immigration_enabled = true
# urban_obstacles = false
# weather_enabled = false

# Audit 5a item 2: scripted (timer-based) population growth for a demo run.
# When true, the server starts with 4 agents (ignoring initial_agents above)
# and spawns +2/+4/+5/+5 at 2/5/10/15 simulated minutes (totals 6/10/15/20),
# keyed on sim-time so it works at any speed. Immigration is disabled while
# active so the schedule is the sole population driver. Same as --scripted-population.
# scripted_population = true

# Explicit obstacle layout (replaces the built-in urban map when non-empty).
# kind = "Building" | "Wall" | "Water" | "Tree"
# [[obstacles]]
# kind = "Building"
# min = [6.0, 3.0]
# max = [10.0, 7.0]

# Pre-recorded scenario events, injected at frame 0 (same as --events-file).
# [[event_schedule]]
# event = "spawn_grain"
# pos = [5.0, 5.0]
# count = 10

# [[event_schedule]]
# event = "set_weather"
# weather = "Rain"
